[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "process"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.24"
opentelemetry = { version = "0.23", features = ["trace"] }
opentelemetry_sdk = { version = "0.23", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.16", features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = "0.15"
tonic = { version = "0.11", default-features = false, features = ["transport"] }
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tempfile = "3"
base64 = "0.22"
prometheus = "0.14"
sysinfo = { version = "0.37", features = ["system"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "migrate"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ark-ff = "0.4"
ark-bn254 = "0.4"
hex = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
stellar-strkey = "0.0.13"
sha2 = "0.10"
hostname = "0.4"
chrono = { version = "0.4", features = ["serde"] }
wasmtime = { version = "14", features = ["cranelift", "pooling-allocator"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
aws-sdk-kms = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

[features]
kms = ["aws-sdk-kms", "aws-config"]
